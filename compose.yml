services:

  restaurant-db:
    image: mysql:8.0.40

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: restaurant_db

    ports:
      - "3307:3306"

    volumes:
      - restaurant-db-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  restaurant-service:
    build:
      context: ./restaurant-service

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://restaurant-db:3306/restaurant_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "1000:1000"

    depends_on:
      restaurant-db:
        condition: service_healthy

  order-db:
    image: mysql:8.0.40

    environment:
      MYSQL_ROOT_PASSWORD: ${ORDER_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: order_db

    ports:
      - "3308:3306"

    volumes:
      - order-db-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  order-service:
    build:
      context: ./order-service

    ports:
      - "1001:1001"

    environment:
      DB_URL: jdbc:mysql://order-db:3306/order_db
      DB_USERNAME: root
      DB_PASSWORD: ${ORDER_MYSQL_ROOT_PASSWORD}

      RESTAURANT_SERVICE_BASE_URL: http://restaurant-service:1000

    depends_on:
      order-db:
        condition: service_healthy

  menu-db:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: menu_db
      MYSQL_ROOT_PASSWORD: ${MENU_MYSQL_ROOT_PASSWORD}

    ports:
      - "3309:3306"

    volumes:
      - menu-db-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD-SHELL", "mysql -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  restaurant-db-data:
  order-db-data:
  menu-db-data: